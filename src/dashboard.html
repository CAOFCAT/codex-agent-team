<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Teams · 实时任务面板</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#0d1b34;--line:#20385d;--text:#e4efff;--muted:#87a0c6;--blue:#76aaff;--gold:#ffca68;--green:#5ce0b0;--red:#ff7d89}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 4%,#18345c 0,transparent 34%),linear-gradient(145deg,#09152b,#071226 65%,#101d39);color:var(--text);font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.shell{max-width:1480px;margin:auto;padding:24px 28px 32px}.top,.headline,.section-title,.panel-head,.task-head,.message-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#3875d9,#1d3c76);font-size:21px}.brand-name{font-weight:800;font-size:17px}.team-name{color:#a9c4ec;font:600 13px ui-monospace,monospace}.meta,.muted,.subtitle,.role,.caption{color:var(--muted)}.meta{font-size:11px}.live{display:flex;align-items:center;gap:7px;padding:7px 11px;color:#8ef0d1;background:#123a3b;border:1px solid #27605c;border-radius:99px;white-space:nowrap}.dot{height:7px;width:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.phase{font-size:10px;border-radius:6px;padding:4px 8px;background:#172d4a;color:#aac7f3}.headline{align-items:end;margin-bottom:15px}.headline h1{font-size:21px;margin:0 0 5px}.headline p{margin:0;color:var(--muted);font-size:11px}.stats{display:flex;gap:18px;color:var(--muted);font-size:11px;white-space:nowrap}.stats b{font:700 15px ui-monospace,monospace;color:var(--text);margin-right:5px}.layout{display:grid;grid-template-columns:295px minmax(400px,1fr) 310px;gap:14px;align-items:stretch}.panel{background:linear-gradient(155deg,#10213de8,#0b1930e8);border:1px solid #1e3557;border-radius:16px;box-shadow:0 15px 40px #02091440}.side,.inbox{padding:17px}.section-title,.panel-head{font-size:13px;font-weight:700;margin-bottom:14px}.progress{height:136px;display:grid;place-items:center;position:relative;margin:3px auto 15px}.ring{position:absolute;width:126px;height:126px;border-radius:50%;background:conic-gradient(var(--blue) var(--progress,0%),#1d3557 0);mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));filter:drop-shadow(0 0 12px #3479ed45)}.ring-label{text-align:center;z-index:1}.ring-label b{display:block;font:700 27px ui-monospace,monospace}.ring-label span{font-size:10px;color:var(--muted)}.bar-label{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-bottom:7px}.bar{height:6px;border-radius:10px;background:#1b3152;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#5798ff,#6fd5ff);border-radius:10px;transition:width .25s}.legend{display:flex;gap:11px;margin:9px 0 17px;color:var(--muted);font-size:9px}.legend i{display:inline-block;height:7px;width:7px;border-radius:2px;margin-right:4px;background:var(--color)}.members{display:grid;gap:7px}.member{display:grid;grid-template-columns:35px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px;border:1px solid #1b3353;border-radius:11px;background:#0d1d35}.avatar{height:33px;width:33px;border-radius:10px;display:grid;place-items:center;background:#172f51;font-size:13px;font-weight:700;color:#8eb9fc}.member-name{font:600 10px ui-monospace,monospace;overflow-wrap:anywhere}.role{font-size:9px;margin-top:3px}.member-state{font-size:9px;color:var(--gold);white-space:nowrap}.main{padding:17px;min-height:540px;display:flex;flex-direction:column}.panel-head{margin-bottom:13px}.panel-head h2,.inbox h2{font-size:13px;margin:0}.caption{font-size:9px}.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;align-content:start;min-height:160px;padding:4px 0 14px}.task{border:1px solid #29436a;background:#0d1c34;border-radius:12px;padding:12px;min-height:126px}.task.running{border-color:#4d84ce}.task.failed{border-color:#934b58}.task.waiting{border-color:#685633}.task-head{font:10px ui-monospace,monospace;color:var(--muted);margin-bottom:9px}.task-id{font-weight:700;color:var(--text);font-size:11px}.task h3{font-size:11px;line-height:1.45;margin:0 0 7px}.task-owner{font:9px ui-monospace,monospace;color:#aac4eb;overflow-wrap:anywhere}.badge{display:inline-block;margin-top:8px;padding:3px 6px;background:#172d4a;color:#aac7f3;border-radius:6px;font-size:9px}.badge.completed{color:var(--green);background:#13352e}.badge.failed{color:#ff9ca5;background:#462331}.badge.waiting{color:var(--gold);background:#40351f}.depends{font-size:9px;color:var(--muted);margin-top:8px;border-top:1px solid #1b3353;padding-top:6px}.detail{border:1px solid #234065;background:#0d1c34;border-radius:12px;padding:13px 14px;margin-top:auto}.detail h3{font-size:11px;margin:0 0 6px}.detail p{font-size:10px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.inbox{display:flex;flex-direction:column;min-height:540px}.inbox-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.messages{display:grid;gap:8px;max-height:480px;overflow:auto}.message{padding:10px;border:1px solid #22395d;border-radius:11px;background:#0d1c34}.message-head{font:9px ui-monospace,monospace;color:#a9c4ec;margin-bottom:6px}.message p{font-size:10px;line-height:1.6;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.message small{font-size:8px;color:var(--muted);display:block;margin-top:7px}.empty{border:1px dashed #2c4569;border-radius:12px;min-height:130px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:10px;padding:18px;line-height:1.7}.inbox-foot{margin-top:auto;border-top:1px solid #203657;padding-top:11px;color:var(--muted);font-size:9px}.error{color:#ff9ca5}.refresh{font-size:9px;color:var(--muted)}
@media(max-width:1100px){.layout{grid-template-columns:270px minmax(0,1fr)}.inbox{grid-column:1/-1;min-height:230px}.messages{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:740px){.shell{padding:15px 12px}.top{align-items:flex-start}.top-right{display:grid;justify-items:end}.headline{display:block}.headline h1{font-size:18px}.stats{margin-top:11px;gap:12px}.layout{grid-template-columns:minmax(0,1fr)}.main,.inbox{min-height:0}.members{grid-template-columns:1fr 1fr}.tasks{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.messages{grid-template-columns:1fr}}@media(max-width:460px){.members{grid-template-columns:1fr}.brand-name{font-size:15px}.stats{flex-wrap:wrap}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><div class="logo">AT</div><div><div class="brand-name">Agent Teams</div><div class="team-name" id="team-name">正在连接团队…</div></div></div><div class="top-right"><div class="meta" id="top-meta"></div><div class="live" id="live"><i class="dot"></i> 实时同步</div></div></header>
<div class="headline"><div><h1 id="goal">Agent Team</h1><p>本机实时面板 <span style="color:#54729c">/</span> <span id="updated">正在加载…</span></p></div><div class="stats" id="stats"></div></div>
<div class="layout"><aside class="panel side"><div class="section-title"><span>总进度</span><span class="muted" id="task-count"></span></div><div class="progress"><div class="ring" id="ring"></div><div class="ring-label"><b id="progress-count">0 / 0</b><span>任务已完成</span></div></div><div class="bar-label"><span>团队进度</span><span id="progress-percent">0%</span></div><div class="bar"><i id="bar"></i></div><div class="legend"><span><i style="--color:var(--green)"></i>已完成</span><span><i style="--color:var(--blue)"></i>进行中</span><span><i style="--color:var(--gold)"></i>等待</span></div><div class="section-title">成员 <span class="muted" id="member-count"></span></div><div class="members" id="members"></div></aside>
<main class="panel main"><div class="panel-head"><h2>⌘ 任务依赖</h2><span class="caption">前置任务完成后，依赖任务才会开始</span></div><div class="tasks" id="tasks"></div><div class="detail" id="detail"><h3>任务详情</h3><p>选择任务查看详情。</p></div></main>
<aside class="panel inbox"><div class="inbox-head"><h2>队长收件箱</h2><span class="caption" id="message-count"></span></div><p class="caption">成员报告和任务结果会出现在这里。</p><div class="messages" id="messages"></div><div class="inbox-foot" id="connection">仅从本机读取当前团队状态</div></aside></div>
</div>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel={staged:'待启动',idle:'空闲',running:'运行中',completed:'已完成',failed:'失败',pending:'等待依赖',claimed:'准备中',in_progress:'进行中',cancelled:'已取消',halted:'已暂停'};
let selectedTask=null,lastUpdated=null;
function summary(output){if(!output)return '暂无成员报告';try{const value=JSON.parse(output);return value.summary||output}catch{return output}}
function draw(data){const team=data.team;if(!team)return;const tasks=team.tasks||[],members=team.members||[],done=tasks.filter(t=>['completed','cancelled'].includes(t.status)).length,active=tasks.filter(t=>['claimed','in_progress'].includes(t.status)).length,waiting=tasks.filter(t=>['pending'].includes(t.status)).length,percent=tasks.length?Math.round(done/tasks.length*100):0;
document.title=`${team.id} · Agent Teams`;document.querySelector('#team-name').textContent=team.id;document.querySelector('#goal').textContent=team.goal;document.querySelector('#updated').textContent=`${statusLabel[team.phase]||team.phase} · 最近更新 ${new Date(team.updatedAt||Date.now()).toLocaleTimeString()}`;document.querySelector('#top-meta').textContent=`${members.length} 名成员　·　${done}/${tasks.length} 完成`;document.querySelector('#stats').innerHTML=`<span><b>${done}</b>已完成</span><span><b>${active}</b>进行中</span><span><b>${waiting}</b>等待依赖</span>`;document.querySelector('#task-count').textContent=`${done} / ${tasks.length} tasks`;document.querySelector('#progress-count').textContent=`${done} / ${tasks.length}`;document.querySelector('#progress-percent').textContent=`${percent}%`;document.querySelector('#ring').style.setProperty('--progress',`${percent}%`);document.querySelector('#bar').style.width=`${percent}%`;document.querySelector('#member-count').textContent=`· ${members.length}`;
document.querySelector('#members').innerHTML=members.map(m=>`<div class="member"><div class="avatar">${esc((m.name||'?').slice(0,1).toUpperCase())}</div><div><div class="member-name">${esc(m.name)}</div><div class="role">${esc(m.role||'团队成员')}</div></div><div class="member-state">● ${esc(statusLabel[m.status]||m.status)}</div></div>`).join('');
document.querySelector('#tasks').innerHTML=tasks.map((t,i)=>{const state=['pending','claimed'].includes(t.status)?'waiting':t.status;const deps=(t.dependencies||[]).map(id=>`<span>${esc(id)}</span>`).join('、');return `<article class="task ${esc(state)}" data-id="${esc(t.id)}"><div class="task-head"><span class="task-id">${esc(t.id)}</span><span>${esc(statusLabel[t.status]||t.status)}</span></div><h3>${esc(t.subject)}</h3><div class="task-owner">${esc(t.assignee)}</div><span class="badge ${esc(state)}">${esc(statusLabel[t.status]||t.status)}</span>${deps?`<div class="depends">依赖：${deps}</div>`:''}</article>`}).join('')||'<div class="empty">当前计划没有任务。</div>';
const chosen=tasks.find(t=>t.id===selectedTask)||tasks[0];if(chosen){selectedTask=chosen.id;document.querySelectorAll('.task').forEach(el=>el.addEventListener('click',()=>{selectedTask=el.dataset.id;draw(data)}));document.querySelector('#detail').innerHTML=`<h3>${esc(chosen.id)} · ${esc(chosen.subject)}</h3><p>负责人：${esc(chosen.assignee)}　·　状态：${esc(statusLabel[chosen.status]||chosen.status)}\n${esc(chosen.description||'无补充说明')}\n${esc(summary(chosen.output))}</p>`}
const reports=tasks.filter(t=>t.output).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));document.querySelector('#message-count').textContent=`最近 ${reports.length} 条`;document.querySelector('#messages').innerHTML=reports.length?reports.map(t=>`<article class="message"><div class="message-head"><span>${esc(t.assignee)}</span><span>${esc(new Date(t.updatedAt||Date.now()).toLocaleTimeString())}</span></div><p>${esc(summary(t.output))}</p><small>关联任务 · ${esc(t.id)}</small></article>`).join(''):'<div class="empty">暂无成员消息。任务结果会显示在这里。</div>';
document.querySelector('#connection').innerHTML=team.failures?.length?`<span class="error">执行提示：${esc(team.failures.join('；'))}</span>`:'● 每秒自动同步 · 仅当前团队';if(team.phase==='completed'||team.phase==='halted')document.querySelector('#live').innerHTML=`<i class="dot" style="background:var(--gold)"></i> ${esc(statusLabel[team.phase])}`;lastUpdated=team.updatedAt;
}
async function refresh(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);draw(await response.json())}catch(error){document.querySelector('#live').innerHTML='<i class="dot" style="background:var(--red)"></i> 连接中断';document.querySelector('#updated').textContent=lastUpdated?`最后同步 ${new Date(lastUpdated).toLocaleTimeString()}`:'正在等待团队状态…'}}
refresh();setInterval(refresh,1000);
</script></body></html>
